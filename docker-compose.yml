version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: anamneses-mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: anamneses_db
      MYSQL_ROOT_PASSWORD: "petscedim2025!"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
