# Validação automática do PET-Cedim.
#
# Roda em runner hospedado pelo GitHub — NÃO tem acesso ao homelab e não implanta nada.
# A implantação é feita pelo agente que roda no próprio CT 104, descrito em scripts/deploy/.
# O papel deste workflow é impedir que um commit que não compila chegue à branch principal.

name: Validação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aplicacao:
    name: Compilar a aplicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o cliente do Prisma
        run: npx prisma generate

      - name: Compilar
        run: npm run build

  imagem:
    name: Construir a imagem de contêiner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Constrói a mesma imagem que o CT 104 vai construir, para que um Dockerfile
      # quebrado apareça aqui e não durante a implantação.
      - name: Construir a imagem
        run: docker build -t cedim-app:validacao .

  documentacao:
    name: Documentação acompanha o código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instrução em CLAUDE.md é um pedido: uma pessoa apressada ou um assistente de IA podem
      # ignorá-la. Este job é o que torna a regra inegociável — ele reprova o pull request.
      #
      # Usa o MESMO script do hook de pre-commit, para que as duas verificações não divirjam.
      - name: Conferir se a documentação foi atualizada
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            case "$base" in
              0000000000000000000000000000000000000000|"") echo "Primeiro push da referência; nada a comparar."; exit 0 ;;
            esac
          fi
          ./scripts/verificar-documentacao.sh "$base" "$head"

  portabilidade:
    name: Verificação em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O time usa sistemas diferentes. A verificação de documentação precisa valer para todos,
      # inclusive Windows, onde o shell, o grep e os fins de linha são outros.
      - name: Autoteste da verificação
        shell: bash
        run: bash scripts/testar-verificacao.sh

      - name: Instalar os hooks como o npm install faria
        shell: bash
        run: |
          node scripts/instalar-hooks.js
          caminho=$(git config core.hooksPath)
          echo "core.hooksPath = $caminho"
          [ "$caminho" = ".githooks" ] || { echo "::error::hooks não foram instalados"; exit 1; }

      - name: O hook precisa recusar um commit sem documentação
        shell: bash
        run: |
          git config user.email "ci@exemplo"
          git config user.name "CI"
          printf '\n// alteração de teste\n' >> app/api/anamneses/route.js
          git add app/api/anamneses/route.js

          if git commit -m "teste: deve ser recusado" 2>saida.txt; then
            echo "::error::O hook aceitou um commit sem documentação."
            exit 1
          fi
          echo "O hook recusou o commit, como esperado:"
          sed 's/^/  | /' saida.txt | head -20
          git reset -q --hard

      - name: O hook precisa aceitar quando a documentação acompanha
        shell: bash
        run: |
          git config user.email "ci@exemplo"
          git config user.name "CI"
          printf '\n// alteração de teste\n' >> app/api/anamneses/route.js
          printf '\n### Nota de teste\n\nA rota passou a responder X na situação Y.\nSegunda linha real.\n' >> docs/api.md
          git add app/api/anamneses/route.js docs/api.md

          git commit -m "teste: deve ser aceito" || { echo "::error::O hook recusou um commit válido."; exit 1; }
          echo "O hook aceitou o commit, como esperado."
          git reset -q --hard HEAD~1
